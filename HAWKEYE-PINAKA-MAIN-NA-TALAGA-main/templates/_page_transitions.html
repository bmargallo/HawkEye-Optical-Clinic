<link rel="stylesheet" href="{{ url_for('static', filename='css/page-transitions.css') }}">
<script nonce="{{ csp_nonce() }}">(function(){var root=document.documentElement;var postResponse={{ 'true' if request.method == 'POST' else 'false' }};var hawkArrival={{ 'true' if hawk_arrival|default(false) else 'false' }};var landingHawk=false;var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;try{landingHawk=sessionStorage.getItem('hk-login-flight-arrival')==='1';if(landingHawk)sessionStorage.removeItem('hk-login-flight-arrival');if(postResponse||hawkArrival){sessionStorage.removeItem('hk-page-transition')}else if(sessionStorage.getItem('hk-page-transition')==='enter'){sessionStorage.removeItem('hk-page-transition');if(!reduce)root.classList.add('page-transition-enter')}}catch(e){}if((hawkArrival||landingHawk)&&!reduce)root.classList.add('login-arrival')})();</script>
<script src="{{ url_for('static', filename='js/page-transitions.js') }}" defer></script>
